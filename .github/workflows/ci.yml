name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e ".[dev,fluent]"
      - name: Run unit tests
        run: python -m unittest discover tests
      - name: Compile package
        run: python -m compileall ansys_mcp ansys_mcp_server.py
      - name: Check dependency consistency
        run: python -m pip check
      - name: Check publication tree
        run: python -m ansys_mcp.publication --root .
      - name: Build distributions
        run: python -m build
      - name: Check distribution contents
        shell: pwsh
        run: |
          $archiveArgs = @()
          Get-ChildItem -LiteralPath dist -File | ForEach-Object { $archiveArgs += @('--artifact', $_.FullName) }
          python -m ansys_mcp.publication --root . @archiveArgs
